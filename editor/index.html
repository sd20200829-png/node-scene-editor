<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ren'Py Node Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>Ren'Py ノードエディタ（MVP）</h1>
      <div class="actions">
        <span id="export-path-label" class="export-path-label">プロジェクトフォルダを選択してください</span>
        <button id="change-path-btn">プロジェクト選択</button>
        <button id="align-btn">ノード整列</button>
        <button id="cleanup-btn">空ノードを整理</button>
        <button id="export-btn">JSON / script.rpy 更新</button>
        <button id="load-project-btn">変更を読み込む</button>
        <button id="cleanup-assets-btn">未使用アセット削除</button>
        <button id="save-script-btn">変更を保存</button>
      </div>
    </header>

    <div id="project-banner" class="project-banner">プロジェクト未選択</div>
    <main class="workspace" id="workspace">
      <svg id="edges-layer"></svg>
      <div id="nodes-layer"></div>

      <div id="minimap" class="minimap">
        <canvas id="minimap-canvas" width="220" height="140"></canvas>
      </div>
    </main>

    <aside class="output">
      <h2>scenes.json</h2>
      <textarea id="json-output" readonly></textarea>
      <h2>script.rpy（生成プレビュー）</h2>
      <textarea id="script-output" readonly></textarea>
    </aside>

    <div id="context-menu" class="context-menu hidden">
      <button id="add-choice-btn">選択肢を追加</button>
      <button id="add-end-choice-btn">ゲーム終了を追加</button>
      <button id="delete-node-btn">ノード削除</button>
      <button id="delete-port-btn">ポート削除</button>
    </div>

    <div id="port-tooltip" class="port-tooltip hidden"></div>

    <div id="scene-preview-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="preview-title">シーンプレビュー</h3>
          <button id="preview-close-btn">閉じる</button>
        </div>
        <div id="preview-stage" class="preview-stage"></div>
        <p id="preview-bgm" class="preview-meta"></p>
        <p id="preview-text" class="preview-text"></p>
        <div id="preview-choices" class="preview-choices"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
